<!DOCTYPE html>
<html>
    <head>
        <title>Students</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="/static/css/shared.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
{% include 'header.html' %}
    <body>
        <div id="header"></div>
        <div class="container py-5">
            <div class="row justify-content-center">
                <h1 class="text-center fw-bold mb-4">{{lastname}}, {{firstname}}</h1>
                <h5 class="text-center fw-bold mb-4">{{u}}</h5>
				<label class="text-center">Level {{level}}</label>
            </div>
            <div class="row justify-content-center mb-5"> 
                <div class="col-md-6 d-flex justify-content-center p-4">
                    <a class="profile-ctr me-4" href="#" data-bs-toggle="modal" data-bs-target="#profileModal">
                        <img class="profile" src="/static/photo/{{u}}.jpg" alt="Profile">
                    </a>
                    <a class="qr-ctr" href="#" data-bs-toggle="modal" data-bs-target="#qrModal">
                        <img class="qr" src="/static/qr/{{u}}.png" alt="QR Code">
                    </a>
                </div>
                <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content bg-transparent border-0">
                        <img src="/static/photo/{{u}}.jpg" class="img-fluid rounded" alt="Profile">
                        </div>
                    </div>
                </div>

                <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content bg-transparent border-0">
                        <img src="/static/qr/{{u}}.png" class="img-fluid rounded" alt="QR Code">
                        </div>
                    </div>
                </div>
            </div>
            <form class="row g-3 justify-content-center" action="{{u}}" method=POST enctype="multipart/form-data">{% csrf_token %}
                <h5 class="text-center fw-bold mb-4">Student Information</h1>
                <div class="col-md-4">
                    <label for="s-lastname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="s-lastname" name=lastname value="{{lastname}}">
                </div>
                <div class="col-md-4">
                    <label for="s-firstname" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="s-firstname" name=firstname value="{{firstname}}">
                </div>
                <div class="col-md-4">
                    <label for="s-nickname" class="form-label">Nickname</label>
                    <input type="text" class="form-control" id="s-nickname" name=nickname value="{{nickname}}">
                </div>
                <div class="col-md-4">
                    <label for="inputGender" class="form-label">Gender</label>
                    <select id="inputGender" class="form-select" name=gender>
                     <!--   <option selected disabled>Choose...</option> -->
						{% if gender == "Male" %}
                        	<option value="Male" selected>Male</option>
                        	<option value="Female">Female</option>
						{% else %}
                        	<option value="Male">Male</option>
                        	<option value="Female" selected>Female</option>
						{% endif %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="s-address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="s-address" name=address value="{{address}}">
                </div>
                <div class="col-md-4">
                    <label for="s-nationality" class="form-label">Nationality</label>
                    <input type="text" class="form-control" id="s-nationality" name=nationality value="{{nationality}}">
                </div>
                <div class="col-md-4">
                    <label for="birthday" class="form-label">Birthday</label>
                    <input type="date" class="form-control" id="birthday" name=birthdate value={{birthdate}}>
                </div>
		 <div class="col-md-4">
                    <label for="spneeds" class="form-label">Does the student has special needs?</label>
                    <select id="spneeds" class="form-select" name=spneeds>
                        <option selected disabled>Choose...</option>
                    		{% if spneeds == "yes" %}
			<option value="yes" selected>Yes</option>
                        <option value="no">No</option>
				{% elif spneeds == "no" %}
			<option value="yes">Yes</option>
                        <option value="no" selected>No</option>
				{% else %}
			<option value="yes">Yes</option>
                        <option value="no">No</option>
				{% endif %}
                    </select>
                </div>
				<div class="col-md-4">
                    <label for="accommodation" class="form-label">Any accomodation needs for the student</label>
                    <input type="text" class="form-control" id="accommodation" name=accommodation value="{{accommodation}}">
                </div>
                <div class="col-md-4">
                    <label for="foodallergy" class="form-label">Food Allergy</label>
                    <input type="text" class="form-control" id="foodallergy" name=allergy value="{{allergy}}">
                </div>
                <div class="col-md-4 mb-5">
                    <label for="s-photo" class="form-label">Upload Photo</label>
                    <input type="file" class="form-control form-control" id="s-photo" accept="image/*" name=imagefile >
                </div>

                <h5 class="text-center fw-bold mb-4">Guardian's Information</h5>
                <div class="col-md-4">
                    <label for="glastname" class="form-label">Guardian's Lastname</label>
                    <input type="text" class="form-control" id="glastname" name=glastname value={{glastname}}>
                </div>
                <div class="col-md-4">
                    <label for="gfirstname" class="form-label">Guardian's Firstname</label>
                    <input type="text" class="form-control" id="gfirstname" name=gfirstname value={{gfirstname}}>
                </div>
				 <div class="col-md-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name=emailadd value={{email_add}}>
                </div>
                <div class="col-md-4">
                    <label for="mobile" class="form-label">Contact Number</label>
                    <input type="text" class="form-control" id="mobile" name=mobile value={{mobile}}>
                </div>
                <div class="col-md-4">
                    <label for="relationship" class="form-label">Relationship to Student</label>
                    <input type="text" class="form-control" id="gusrdian" name=relationship value={{relationship}}>
                </div>
               <div class="col-md-4">
                    <label for="parent" class="parent-info form-label">If you are not the parent, name of parent?</label>
                    <input type="text" class="form-control" id="parent" name=parent>
                </div>
			<div class="col-md-4">
                    <label for="pnumber" class="parent-info form-label">Parent's Contact Number</label>
                    <input type="text" class="form-control" id="pnumber" name=pnumber>
                </div>
                <div class="col-md-4">
                    <label for="dgroup" class="form-label">Are you part of a DGroup</label>
					    <select id="dgroup" class="form-select" name=dgroupmember>
                        <option selected disabled>Choose...</option>
						{% if dgroupmember == "yes" %}
                        <option value="yes" selected>Yes</option>
                        <option value="no">No</option>
						{% else %}
                        <option value="yes">Yes</option>
                        <option value="no" selected>No</option>
						{% endif %}
                    </select>
                </div>
				
				
<!--
		    {% if dgroupmember == "yes" %}
       			{{pdglead}}
			{% endif %}
-->	
		<div id="dgroup-container"></div>
				<div id="cluster-name"></div>


				
				
				
                <div class="col-12 d-flex justify-content-center mt-4">
                <button type="submit" class="regbtn btn btn-dark px-5 pt-3 pb-3 mt-5">Update</button>
                </div>
            </div>
        </div>
        


        <!-- BOOTSTRAP SCRIPT -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous"></script>

        <!-- MAIN SCRIPT -->
        <script>
            //FETCHING HEADER
/*            fetch("/static/html/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
*/
            const select = document.getElementById("dgroup");
            const container1 = document.getElementById("dgroup-container");
			const container2 = document.getElementById("cluster-name");
            select.addEventListener("change", function () {
                if (this.value === "yes") {
                container1.classList.add("col-md-4", "mb-3");
                container1.innerHTML = `
                        <label for="dg-name" class="form-label">DGroup Leader</label>
                        <input type="text" class="form-control" id="dg-name" name=pdglead value="{{pdglead}}">
                `;
				container2.classList.add("col-md-4", "mb-3");
                container2.innerHTML = `
                        <label for="cl-name" class="form-label">Cluster Name</label>
                        <input type="text" class="form-control" id="cl-name" name=cluster value={{cluster}}>
                `;
                } else {
                container1.classList.remove("col-md-4", "mb-3");
                container1.innerHTML = "";
				container2.classList.remove("col-md-4", "mb-3");
                container2.innerHTML = ""; 
                }
            });
			if (select.value === "yes") {
			container1.classList.add("col-md-4", "mb-3");
			container1.innerHTML = `
					<label for="dg-name" class="form-label">DGroup Leader</label>
					<input type="text" class="form-control" id="dg-name" name=pdglead value="{{pdglead}}">
			`;
			container2.classList.add("col-md-4", "mb-3");
			container2.innerHTML = `
					<label for="cl-name" class="form-label">Cluster Name</label>
					<input type="text" class="form-control" id="cl-name" name=cluster value={{cluster}}>
			`;
			} else {
			container1.classList.remove("col-md-4", "mb-3");
			container1.innerHTML = "";
			container2.classList.remove("col-md-4", "mb-3");
			container2.innerHTML = ""; 
			}
        </script>
    </body>
</html>
