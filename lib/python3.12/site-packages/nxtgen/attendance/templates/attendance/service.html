<!DOCTYPE html>
<html>
    <head>
        <title>NxtGen KiDs In-Out</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="/static/css/shared.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
	{% include 'header.html' %}
	<body>
	<div id="header"></div>
        <div class="container justify-content py-5">
			<h1>Church Service {{u}}</h1>
			<table class="table table-bordered text-center align-middle">
				<thead class="table-dark">
					<th>Level</th>
					<th>Age Bracket</th>
					<th>Total</th>
				</thead>
				<tbody>
					<tr>
						<td><a href='{{u}}/level/0'>0</a></td>
						<td>0 - 3</td>
						<td>{{g.0}}</td>
					<tr>
					<tr>
						<td><a href='{{u}}/level/1'>1</a></td>
						<td>4 - 5</td>
						<td>{{g.1}}</td>
					<tr>
					<tr>
						<td><a href='{{u}}/level/2'>2</a></td>
						<td>6 - 7</td>
						<td>{{g.2}}</td>
					<tr>
					<tr>
						<td><a href='{{u}}/level/3'>3</a></td>
						<td>8 - 9</td>
						<td>{{g.3}}</td>
					<tr>
					<tr>
						<td><a href='{{u}}/level/4'>4</a></td>
						<td>10 - 12</td>
						<td>{{g.4}}</td>
					<tr>
				</tbody>
			</table>
			<table class="table table-bordered text-center align-middle">
				<thead class="table-dark">
					<th>Name</th>
					<th>Level</th>
					<th>In</th>
					<th>Out</th>

				</thead>
				<tbody>
				<tr>
				{% for x, y in h.items %}
					<td>{{x}}</td>
					<td>{{y.0}}</td>
					<td>{{y.1}}</td>
					<td>{{y.2}}</td>
				</tr>
				{% endfor %}
				</tbody>
			</table>
		</div>
	</div>
	<!-- BOOTSTRAP SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous"></script>

            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
*/
        </script>
    </body>
</html>
