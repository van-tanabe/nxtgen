<!DOCTYPE html>
<html>
    <head>
        <title>Registration</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="shared.css">

    </head>
    <body>
        <div id="header"></div>
        <div class="container py-5 justify-content">
            <form class="row g-3 justify-content-center">
                <h1 class="text-center fw-bold mb-4">Registration</h1>
                <h5 class="text-center fw-bold mb-4">Student's Information</h1>
                <div class="col-md-4">
                    <label for="s-lastname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="s-lastname">
                </div>
                <div class="col-md-4">
                    <label for="s-firstname" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="s-firstname">
                </div>
                <div class="col-md-4">
                    <label for="s-nickname" class="form-label">Nickname</label>
                    <input type="email" class="form-control" id="s-nickname">
                </div>
                <div class="col-md-4">
                    <label for="inputGender" class="form-label">Gender</label>
                    <select id="inputGender" class="form-select">
                        <option selected disabled>Choose...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="s-address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="s-address">
                </div>
                <div class="col-md-4">
                    <label for="s-nationality" class="form-label">Nationality</label>
                    <input type="email" class="form-control" id="s-nationality">
                </div>
                <div class="col-md-4">
                    <label for="birthday" class="form-label">Birthday</label>
                    <div class="input-group birthday-group">
                        <select id="month" class="form-select">
                            <option disabled selected>MM</option>
                        </select>
                        <select id="day" class="form-select">
                            <option disabled selected>DD</option>
                        </select>
                        <select id="year" class="form-select">
                            <option disabled selected>YYYY</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4 mb-5">
                    <label for="foodallergy" class="form-label">Food Allergy</label>
                    <input type="text" class="form-control" id="foodallergy">
                </div>

                <h5 class="text-center fw-bold mb-4">Parent's Information</h5>
                <div class="col-md-4">
                    <label for="p-name" class="form-label">Parent's Name</label>
                    <input type="text" class="form-control" id="p-name">
                </div>
                <div class="col-md-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="col-md-4">
                    <label for="dgroup" class="form-label">Are you part of a DGroup</label>
                    <select id="dgroup" class="form-select">
                        <option selected disabled>Choose...</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div id="dgroup-container" class="col-md-4"></div>

                 <h5 class="text-center fw-bold mb-4 mt-5">Guardian's Information</h5>
                 <div class="col-md-4">
                    <label for="g-name1" class="form-label">Guardian 1</label>
                    <input type="text" class="form-control" id="g-name1">
                </div>
                <div class="col-md-4">
                    <label for="g-name2" class="form-label">Guardian 2</label>
                    <input type="text" class="form-control" id="g-name2">
                </div>

                <div class="col-12 d-flex justify-content-center mt-4">
                <button type="submit" class="btn btn-dark px-4 mt-5">Register</button>
                </div>
            </div>
        </div>
            
        </div>

        <!-- BOOTSTRAP SCRIPT -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous"></script>

        <!-- MAIN SCRIPT -->
        <script>
            //FETCHING HEADER
            fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
            
            //GET MONTHS
            for (let m = 1; m <= 12; m++) {
                document.getElementById("month").innerHTML += `<option>${m.toString().padStart(2, '0')}</option>`;
            }

            //GET DAYS
            for (let d = 1; d <= 31; d++) {
                document.getElementById("day").innerHTML += `<option>${d.toString().padStart(2, '0')}</option>`;
            }

            //GET YEARS
            for (let y = 2025; y >= 2011; y--) {
                document.getElementById("year").innerHTML += `<option>${y}</option>`;
            }

            const select = document.getElementById("dgroup");
            const container = document.getElementById("dgroup-container");

            select.addEventListener("change", function () {
                if (this.value === "yes") {
                container.innerHTML = `
                        <label for="dg-name" class="form-label">DGroup Leader</label>
                        <input type="text" class="form-control" id="dg-name">
                `;
                } else {
                container.innerHTML = ""; 
                }
  });
        </script>
    </body>
</html>
