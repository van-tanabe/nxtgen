<!DOCTYPE html>
<html>
    <head>
        <title>NxtGen In-Out</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="/static/css/shared.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
	{% include 'header.html' %}
    <body>
        <div id="header"></div>
        <div class="container justify-content py-5">
            <div class="row justify-content-center">
                <h1 class="text-center fw-bold mb-5">
				<script src="https://cdn.logwork.com/widget/digital.js"></script>
<a href="https://logwork.com/current-time-in-santa-rosa-philippines-negros-occidental" class="digital-clock text-center" data-style="style1" data-size="350" data-timezone="Asia/Manila" data-language="en" data-format="12" data-date="1" data-seconds="1">NxtGen In-Out</a>
				</h1>

				<form method=POST action="/transaction/">{% csrf_token %}
                <div class="row justify-content-center mb-5">
                    <div class="col-md-12">
                        <table class="table table-bordered text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Student ID</th>
                                </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td><input type=text id=k_id name=k_id></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
				<div class="row justify-content-center mb-5">
						{% if l.register.k_id %}	
								<img style="width: 50%" src="/static/photo/{{l.register.k_id}}.jpg" width="300" height="300">
								<h1 class="text-center fw-bold">{{l.register.firstname}} {{l.register.lastname}}</h1>
								<h5 class="text-center">{{l.register.k_id}}</h5>
								<h5 class="text-center">Level {{lev}}</h5>
								<h5 class="text-center">Church Service: {{service}}</h5>
								<h5 class="text-center">Time {{o}}: {{tdate}}</h5>
						{% endif %}
				</div>
				</form>
            </div>
        </div>
        <!-- BOOTSTRAP SCRIPT -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous"></script>

        <!-- MAIN SCRIPT -->
        <script>
            //FETCHING HEADER
/*            fetch("/static/html/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
*/
        </script>
    </body>
</html>
